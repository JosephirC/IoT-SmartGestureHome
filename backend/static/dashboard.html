<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>

<body>
    <div id="app">
        <div class="container">
            <h1>SmartHome - Reconnaissance de Gestes</h1>

            <div class="camera-section">
                <div class="camera-frame">
                    <img :src="cameraUrl" alt="Camera">
                </div>
                <div class="gesture-display" :class="{ empty: !gesture }">
                    <div v-if="gesture">Geste: <strong>{{ gesture }}</strong></div>
                    <div v-else>En attente de geste...</div>
                </div>
            </div>

            <div class="controls-grid">
                <div class="control-card">
                    <h3>Lights</h3>
                    <div class="status-light" :class="{ on: state.leds === 'ON', off: state.leds !== 'ON' }"></div>
                    <p>{{ state.leds === 'ON' ? 'On' : 'Off' }}</p>
                </div>

                <div class="control-card">
                    <h3>Fans</h3>
                    <div class="status-light" :class="{ on: state.fans === 'ON', off: state.fans !== 'ON' }"></div>
                    <p>{{ state.fans === 'ON' ? 'On' : 'Off' }}</p>
                </div>

                <div class="control-card">
                    <h3>Door</h3>
                    <div class="status-light" :class="{ on: state.door === 'OPEN', off: state.door !== 'OPEN' }"></div>
                    <p>{{ state.door === 'OPEN' ? 'Open' : 'Closed' }}</p>
                </div>
            </div>

            <div class="input-group">
                <input v-model="input" @keyup.enter="send" type="text" placeholder="Type a gesture...">
                <button @click="send">Send</button>
            </div>

            <div class="log-section">
                <h3>Log</h3>
                <div v-if="logs.length === 0" style="color: #999;">No actions</div>
                <div v-for="(log, i) in logs" :key="i" class="log-item">
                    <div>{{ log.msg }}</div>
                    <div class="log-time">{{ log.time }}</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>

</html>
