<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconnaissance ASL en Temps Réel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        #video-stream {
            width: 100%;
            display: block;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Reconnaissance ASL en Temps Réel</h1>

        <div class="video-wrapper">
            <!-- LA LIGNE MAGIQUE -->
            <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Flux vidéo ASL">
        </div>
    </div>
</body>
</html>
